name: Deploy to server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm i

      - name: Build static site
        run: npm run build

      - name: Deploy static files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_USER_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/*"
          target: "/var/www/eashiryaev/"
          strip_components: 1
          rm: true

      - name: Configure nginx proxy for VSB backend
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_USER_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cat > /tmp/vsb_nginx.py << 'PYEOF'
            import os, subprocess, sys
            MARKER = 'VSB_PROXY'
            PROXY = """
                # VSB_PROXY
                location ~ ^/(surface|health) {
                    proxy_pass http://157.22.195.189:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_read_timeout 120;
                }"""
            def find_conf():
                for pat in ['var/www/eashiryaev', 'eashiryaev']:
                    r = subprocess.run(['grep', '-rl', pat, '/etc/nginx'], capture_output=True, text=True)
                    lines = [l.strip() for l in r.stdout.splitlines() if l.strip()]
                    for l in lines:
                        if any(d in l for d in ('sites-enabled', 'sites-available', 'conf.d')):
                            return l
                    if lines: return lines[0]
                for d in ('/etc/nginx/sites-enabled', '/etc/nginx/conf.d'):
                    if os.path.isdir(d):
                        for f in sorted(os.listdir(d)):
                            p = os.path.join(d, f)
                            if os.path.isfile(p):
                                try:
                                    c = open(p).read()
                                    if 'listen 80' in c or 'listen 443' in c: return p
                                except: pass
                return ''
            conf = find_conf()
            if not conf: print('nginx config not found'); sys.exit(1)
            c = open(conf).read()
            if MARKER in c: print('already configured: ' + conf); sys.exit(0)
            idx = c.rfind('}')
            open(conf, 'w').write(c[:idx] + PROXY + '\n' + c[idx:])
            print('proxy added to ' + conf)
            PYEOF
            python3 /tmp/vsb_nginx.py
            nginx -t && systemctl reload nginx
